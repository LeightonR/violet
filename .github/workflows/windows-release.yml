name: Build Windows release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows 10/11 x64 package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Build, audit, and privacy-scan the unsigned artifacts
        shell: pwsh
        run: >-
          ./packaging/Build-Release.ps1
          -BuildRoot 'D:\VioletBuild'
          -InstallInnoSetup

      - name: Preserve unsigned review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Violet-0.1.1-win64
          path: dist/
          if-no-files-found: error
          retention-days: 14
