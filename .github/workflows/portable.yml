name: Portable desktop smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1
      - run: python -m pip install .
      - name: Launch the portable recording window without audio devices
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from violet.portable import DictationWindow
          app = QApplication([])
          window = DictationWindow()
          assert window.setup.wait(10000)
          app.processEvents()
          assert window.action.isEnabled() and "Download model" in window.action.text()
          window.close()
          PY
      - name: Generate a synthetic voice fixture on macOS
        if: runner.os == 'macOS'
        run: say --file-format=WAVE --data-format=LEI16@16000 -o /tmp/violet-fixture.wav "Violet is a local dictation tool. Please send the report tomorrow."
      - name: Generate a synthetic voice fixture on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y espeak-ng
          espeak-ng -w /tmp/violet-fixture.wav "Violet is a local dictation tool. Please send the report tomorrow."
      - name: Verify offline inference through the recording window
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          model_path=$(python -c "from violet.models import model_spec, download_verified_model; from violet.config import model_cache_dir; print(download_verified_model(model_spec('tiny.en'), model_cache_dir(), user_confirmed=True))")
          python tests/portable_fixture.py "$model_path" /tmp/violet-fixture.wav
